name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Backend Master/**"
  pull_request:
    paths:
      - "Backend Master/**"

defaults:
  run:
    working-directory: Backend Master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: crm_ci
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use
      JWT_MFA_SECRET: ci-only-mfa-secret-not-for-real-use
      MFA_ENABLED: "false"
      AUTO_EMAIL_JOBS_ENABLED: "false"
      AI_COPILOT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Backend Master/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx sequelize-cli db:migrate
        continue-on-error: true # schema/migration drift is tracked separately (Technical_Debt.md) — never block CI on it today

      - name: Run test suite
        run: npm test

      - name: npm audit (report only, non-blocking)
        run: npm audit --audit-level=critical || true
