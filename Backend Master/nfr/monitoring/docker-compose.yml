# Pile de supervision de l'audit non fonctionnel : Prometheus + Grafana +
# exporteur PostgreSQL + SonarQube. Le backend reste lancé sur l'hôte.
#   docker compose -f nfr/monitoring/docker-compose.yml --env-file .env up -d
# Prometheus : http://localhost:9090 — Grafana : http://localhost:3001 (admin / admin)
# SonarQube : http://localhost:9001 (profil "sonar" : docker compose --profile sonar up -d)
# Le port 9000 est laissé au SonarQube déjà présent sur le poste.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: "host.docker.internal:${DB_PORT}/${DB_NAME}_test?sslmode=disable"
      DATA_SOURCE_USER: "${DB_USER}"
      DATA_SOURCE_PASS: "${DB_PASSWORD}"
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Lecture seule sans connexion : poste local uniquement, pour les captures de preuve.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

  sonarqube:
    image: sonarqube:community
    profiles: ["sonar"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
    ports: ["9001:9000"]

volumes:
  prometheus-data:
  grafana-data:
  sonarqube-data:
