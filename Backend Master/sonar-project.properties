# SonarQube — analyse du backend CRM PROBAR.
#   npx sonarqube-scanner -Dsonar.host.url=http://localhost:9001 -Dsonar.token=<jeton>
sonar.projectKey=crm-probar-backend
sonar.projectName=CRM PROBAR - Backend
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
sonar.exclusions=src/migrations/**,src/seeders/**,src/scripts/**,src/uploads/**,**/node_modules/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
